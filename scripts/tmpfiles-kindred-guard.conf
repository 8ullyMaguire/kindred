# Reclaim /tmp from runaway kindred ingest runs.
#
# The problem: a kindred ingest process that restarts every couple of
# minutes leaves a ~131 MB SQLite database per run. /tmp here is a 4 GB
# tmpfs, so about 30 runs -- two hours -- and the tmpfs is full. A full
# tmpfs does not fail one process; it fails every process that touches it,
# which is how a stranger's ingest loop takes down unrelated services
# sharing the filesystem.
#
# Why the stock configuration does nothing: /usr/lib/tmpfiles.d/tmp.conf
# ships `D /tmp 1777 root root 30d`, so a file created 37 seconds ago is
# untouchable for a month, and the stock clean timer runs once a day. The
# disk fills long before either would act.
#
# Why a name glob and not a size threshold: tmpfiles.d has no size
# condition, only an age. Matching on the path is what makes the rule
# precise -- /tmp/kr-* is this project's artifacts and nothing else in
# /tmp matches, so a sweep cannot delete a script someone is editing.
#
# TWO lines, because one is not enough.
#
# The lowercase x means "remove only if NOT in use"; the capital X is the
# opposite, removing only files something has open, which is the reverse of
# a cleanup rule. An ingest writing its database right now holds an open
# descriptor, and lowercase x skips it -- the age reclaims abandoned files
# and the in-use check protects live ones.
#
# But `x` removes only FILES, never a directory. A run leaves
# kr-<random>/ containing the database, so a rule that only matches files
# reclaims nothing: the 25 MB in my test survived every clean, correctly,
# because the thing matching the glob was a directory and `x` does not
# remove directories. `R` is the recursive form and is what actually
# reclaims space.
#
# Both lines are kept: R handles the directory and its contents, x handles
# a bare database file left directly in /tmp.
#
# Field order is Type Path Mode UID GID Age Argument, so the age comes
# AFTER the dashes. Writing `X /tmp/kr-* 5min` puts "5min" where the mode
# belongs and systemd rejects the whole file with "Invalid mode '5min'" --
# silently, as far as `systemd-tmpfiles --cat-config` is concerned, which
# still prints the broken line as if it were configuration.
#
# 5 minutes, paired with a 15-minute sweep timer (see
# systemd-tmpfiles-clean.timer.d/kindred-guard.conf): files present are
# from the last ~20 minutes, so about 10 runs, roughly 1.3 GB of a 4 GB
# tmpfs. The shipped daily timer would have let the whole volume fill.
#
# Verify:  systemd-tmpfiles --cat-config | grep 'kr-\*'
#          systemd-tmpfiles --clean        # must not print "Invalid"
# Test:    touch -d '20 minutes ago' /tmp/kr-x/f.db; systemd-tmpfiles --clean
x /tmp/kr-* - - - 5min
R /tmp/kr-* - - - 5min
